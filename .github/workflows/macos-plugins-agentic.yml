name: macOS + AU/VST3 Agentic CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      # ---- customize these to your repo ----
      WORKSPACE: App.xcworkspace        # or set to "" if you use an .xcodeproj only
      SCHEME: App                       # macOS app / harness scheme, if you have one
      CONFIG: Debug
      # -------------------------------------
      ARTIFACT_ROOT: failed_artifacts/macos
      LOG_DIR: failed_artifacts/macos/ci_logs
      BUILD_DIR: failed_artifacts/macos/build
      XCRESULT_DIR: failed_artifacts/macos/build/App.xcresult

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: bash
        run: |
          mkdir -p "$LOG_DIR" "$BUILD_DIR"
          {
            echo "=== macOS preflight ==="
            echo "workspace: ${WORKSPACE:-'(none)'}"
            echo "scheme: $SCHEME"
            echo "config: $CONFIG"
          } | tee "$LOG_DIR/preflight.txt"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || xcodebuild -version

      - name: Resolve SPM (if workspace present)
        if: ${{ env.WORKSPACE != '' }}
        run: xcodebuild -resolvePackageDependencies -workspace "$WORKSPACE" -scheme "$SCHEME"

      - name: Build macOS app / harness (xcodebuild)
        id: xcodebuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [[ -n "$WORKSPACE" ]]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -destination 'platform=macOS' \
              -derivedDataPath "$BUILD_DIR" \
              -resultBundlePath "$XCRESULT_DIR" \
              build | tee "$LOG_DIR/xcodebuild_stdout.log"
          else
            # fallback if you only have an .xcodeproj committed
            PROJ=$(ls -1 *.xcodeproj | head -n1)
            xcodebuild \
              -project "$PROJ" \
              -scheme "$SCHEME" \
              -configuration "$CONFIG" \
              -destination 'platform=macOS' \
              -derivedDataPath "$BUILD_DIR" \
              -resultBundlePath "$XCRESULT_DIR" \
              build | tee "$LOG_DIR/xcodebuild_stdout.log"
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Install CMake (if missing)
        shell: bash
        run: |
          command -v cmake >/dev/null || brew install cmake

      - name: Configure VST3 via CMake (Xcode generator)
        continue-on-error: true
        run: |
          cmake -B plugin_build -S . -GXcode -DCMAKE_BUILD_TYPE="$CONFIG" 2>&1 | tee "$LOG_DIR/cmake_configure.log"

      - name: Build VST3 (CMake)
        id: cmake_build
        continue-on-error: true
        run: |
          cmake --build plugin_build --config "$CONFIG" 2>&1 | tee "$LOG_DIR/cmake_build.log"

      - name: Collect plugin artifacts
        shell: bash
        run: |
          mkdir -p "$ARTIFACT_ROOT/plugins"
          # Common output locations (adjust if your CMake outputs elsewhere)
          find plugin_build -name "*.vst3" -print -exec cp -R {} "$ARTIFACT_ROOT/plugins/" \; || true
          find plugin_build -name "*.component" -print -exec cp -R {} "$ARTIFACT_ROOT/plugins/" \; || true
          # Also check JUCE-style DerivedData product dirs
          find "$BUILD_DIR" -name "*.vst3" -print -exec cp -R {} "$ARTIFACT_ROOT/plugins/" \; || true
          find "$BUILD_DIR" -name "*.component" -print -exec cp -R {} "$ARTIFACT_ROOT/plugins/" \; || true

      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-plugin-build-artifacts
          path: |
            failed_artifacts/macos/
            plugin_build/**/*
            !plugin_build/**/.git/**

  analyze:
    runs-on: macos-14
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-plugin-build-artifacts
          path: artifacts

      - name: Extract xcresult info
        id: xcresult_info
        continue-on-error: true
        run: |
          RESULT_DIR="artifacts/failed_artifacts/macos/build/App.xcresult"
          if [ -d "$RESULT_DIR" ]; then
            echo "Found xcresult directory"
            # Try modern form, fall back to legacy
            if xcrun xcresulttool get --path "$RESULT_DIR" --format json > xcresult_data.json 2>/dev/null; then
              echo "Used modern xcresulttool"
            elif xcrun xcresulttool get --legacy --path "$RESULT_DIR" --format json > xcresult_data.json 2>/dev/null; then
              echo "Used legacy xcresulttool"
            else
              echo "xcresulttool could not process result bundle"
              echo "{}" > xcresult_data.json
            fi
          else
            echo "No xcresult directory found"
            echo "{}" > xcresult_data.json
          fi

      - name: Generate analysis summary
        id: analysis
        run: |
          cat > analyze.py << 'EOF'
          import json, os, re, glob
          
          # Load xcresult data if available
          try:
              with open('xcresult_data.json', 'r') as f:
                  xcresult_data = json.load(f)
          except:
              xcresult_data = {}
              
          # Setup paths
          ROOT = "artifacts"
          LOG_DIR = os.path.join(ROOT, "failed_artifacts/macos/ci_logs")
          
          def read_file(path):
              try:
                  with open(path, "r", errors="ignore") as f:
                      return f.read()
              except Exception:
                  return ""
          
          def grep_errors(text, limit=20):
              hits = []
              for line in text.splitlines():
                  # Swift/ObjC/C++ compile & linker errors
                  if re.search(r":\d+:\d+:\s*(error|fatal error):", line):
                      hits.append(line)
                  elif re.search(r"(error: linker command failed with exit code)|(Undefined symbols for architecture)|(ld: error:)", line):
                      hits.append(line)
                  elif "error:" in line and any(x in line for x in [".swift", ".mm", ".m", ".cpp", ".cc", ".c"]):
                      hits.append(line)
                  if len(hits) >= limit:
                      break
              return hits
          
          def extract_xcresult_issues():
              issues = {"errorCount": 0, "warningCount": 0}
              top_errors = []
              
              try:
                  # Extract actions which contain issue info
                  actions = xcresult_data.get("actions", {}).get("_values", [])
                  for action in actions:
                      action_result = action.get("actionResult", {})
                      action_issues = action_result.get("issues", {})
                      
                      # Get errors and warnings
                      errors = action_issues.get("errorSummaries", {}).get("_values", [])
                      warnings = action_issues.get("warningSummaries", {}).get("_values", [])
                      
                      issues["errorCount"] += len(errors)
                      issues["warningCount"] += len(warnings)
                      
                      # Extract top error details
                      for error in errors[:10]:
                          msg = error.get("message", {}).get("_value", "")
                          loc = error.get("documentLocationInCreatingWorkspace", {}).get("url", "")
                          top_errors.append((msg, loc))
              except Exception as e:
                  print(f"Error extracting xcresult issues: {e}")
                  
              return {"issues": issues, "topErrors": top_errors}
          
          # Start building summary parts
          parts = []
          
          # Preflight info
          preflight = read_file(os.path.join(LOG_DIR, "preflight.txt"))
          if preflight:
              parts.append("**Preflight**\n\n```\n" + preflight.strip() + "\n```")
          
          # Xcodebuild log
          xcodebuild_log = read_file(os.path.join(LOG_DIR, "xcodebuild_stdout.log"))
          if xcodebuild_log:
              errors = grep_errors(xcodebuild_log, limit=15)
              parts.append("**xcodebuild errors (top)**\n" + 
                          ("```\n" + "\n".join(errors) + "\n```" if errors else "_No standard compiler/linker error lines matched._"))
          
          # CMake logs
          cmake_config_log = read_file(os.path.join(LOG_DIR, "cmake_configure.log"))
          if cmake_config_log:
              config_errors = [l for l in cmake_config_log.splitlines() if "error" in l.lower() or "not found" in l.lower()][:15]
              parts.append("**CMake configure (top issues)**\n" + 
                          ("```\n" + "\n".join(config_errors) + "\n```" if config_errors else "_No obvious configure errors._"))
          
          cmake_build_log = read_file(os.path.join(LOG_DIR, "cmake_build.log"))
          if cmake_build_log:
              build_errors = grep_errors(cmake_build_log, limit=15)
              if not build_errors:
                  # Also scan for cmake build fails not caught by file:line pattern
                  build_errors = [l for l in cmake_build_log.splitlines() 
                                 if re.search(r"\b(error|FAILED|not found|undefined)\b", l, re.I)][:15]
              parts.append("**CMake build (top issues)**\n" + 
                          ("```\n" + "\n".join(build_errors) + "\n```" if build_errors else "_No obvious build errors._"))
          
          # xcresult summary
          xcresult_info = extract_xcresult_issues()
          if xcresult_info:
              parts.append(f"**.xcresult:** {xcresult_info['issues'].get('errorCount',0)} errors, {xcresult_info['issues'].get('warningCount',0)} warnings.")
              if xcresult_info["topErrors"]:
                  parts.append("**Top .xcresult errors**")
                  for msg, loc in xcresult_info["topErrors"]:
                      line = f"- {msg}"
                      if loc:
                          line += f"\n  - `{loc}`"
                      parts.append(line)
          
          # Artifact presence
          vst3_files = glob.glob(os.path.join(ROOT, "failed_artifacts/macos/plugins", "*.vst3"))
          component_files = glob.glob(os.path.join(ROOT, "failed_artifacts/macos/plugins", "*.component"))
          app_files = glob.glob(os.path.join(ROOT, "failed_artifacts/macos/build", "**", "*.app"), recursive=True)
          
          parts.append("**Artifacts found**")
          parts.append(f"- VST3: {len(vst3_files)} {'✅' if vst3_files else '❌'}")
          for path in vst3_files[:6]:
              parts.append(f"  - `{os.path.relpath(path, ROOT)}`")
              
          parts.append(f"- AU .component: {len(component_files)} {'✅' if component_files else '❌'}")
          for path in component_files[:6]:
              parts.append(f"  - `{os.path.relpath(path, ROOT)}`")
              
          parts.append(f"- macOS .app: {len(app_files)} {'✅' if app_files else '❌'}")
          for path in app_files[:6]:
              parts.append(f"  - `{os.path.relpath(path, ROOT)}`")
          
          # Write summary
          summary = "\n\n".join(parts).strip()
          os.makedirs("out", exist_ok=True)
          with open("out/summary.md", "w") as f:
              f.write(summary)
              
          print(summary)
          EOF
          
          python3 analyze.py

      - name: Upload analyzer summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-agentic-summary
          path: out/summary.md

      - name: Post summary to job
        if: always()
        run: |
          echo "### macOS Plugin Build Triage" >> $GITHUB_STEP_SUMMARY
          cat out/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "## macOS Plugin Build Triage\n\n" + body
            });
