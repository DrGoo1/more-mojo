name: Build TestApp + Acceptance

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-accept:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set execute bits on scripts
        working-directory: ProGUI
        run: |
          chmod +x scripts/screenshots.sh || true
          chmod +x scripts/acceptance.sh || true
          chmod +x Tests/TestApp/build_test_app.sh || true

      - name: Build TestApp (Swift)
        working-directory: ProGUI
        run: |
          if [ -x "Tests/TestApp/build_test_app.sh" ]; then
            bash Tests/TestApp/build_test_app.sh
          else
            echo "WARN: build_test_app.sh missing; skipping" >&2
          fi

      - name: Build JuceRunner (CMake)
        working-directory: ProGUI/Tools/JuceRunner
        run: |
          mkdir -p build
          cd build
          cmake -G "Unix Makefiles" ..
          cmake --build . --config Release --parallel 3

      - name: Run acceptance (screenshots sanity)
        working-directory: ProGUI
        run: |
          bash scripts/acceptance.sh || (echo "Acceptance failed" >&2; exit 1)

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-screenshots
          path: ProGUI/screenshots/*.png

      - name: Upload TestApp (if present)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGUITestApp
          path: ProGUI/Tests/TestApp/build/ProGUITestApp.app

      - name: Upload JuceRunner app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGUIJuceRunner
          path: ProGUI/Tools/JuceRunner/build/ProGUIJuceRunner.app
